---
- name: Deploy HTTP-Only Production Apache Web Server
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    # Production Performance Settings
    apache_keepalive: "On"
    apache_max_keepalive_requests: 150
    apache_keepalive_timeout: 3
    apache_server_tokens: "Prod"
    apache_server_signature: "Off"
    apache_trace_enable: "Off"

  tasks:
    - name: "1. Update apt cache safely"
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "2. Install Apache2 and UFW Firewall"
      apt:
        name:
          - apache2
          - ufw
        state: present

    - name: "3. Enable Core Production Apache Modules (No SSL)"
      community.general.apache2_module:
        name: "{{ item }}"
        state: present
      loop:
        - rewrite
        - headers
        - expires
      notify: Restart Apache

    - name: "4. Create Security Hardening & Performance Config from template"
      template:
        src: security-hardening.conf.j2
        dest: /etc/apache2/conf-available/security-hardening.conf
      notify: Restart Apache

    - name: "4b. Enable Security Hardening Config"
      command: a2enconf security-hardening
      args:
        creates: /etc/apache2/conf-enabled/security-hardening.conf
      notify: Restart Apache

    # --- FIREWALL CONFIGURATION OPTIMIZED FOR SAFETY & JENKINS ---
    - name: "5. Set UFW default incoming policy to allow (Safe Mode)"
      community.general.ufw:
        policy: allow
        direction: incoming

    - name: "5b. Configure Specific Firewall Rules Safely"
      community.general.ufw:
        rule: allow
        name: "{{ item }}"
      loop:
        - 'OpenSSH'
        - 'Apache'

    - name: "5c. Explicitly Allow Jenkins Port"
      community.general.ufw:
        rule: allow
        port: '8080'
        proto: tcp

    - name: "5d. Enable UFW Firewall Service"
      community.general.ufw:
        state: enabled
    # -------------------------------------------------------------

    - name: "6. Deploy Custom Production Web Page from template"
      template:
        src: index.html.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: "7. Ensure Apache Service is Started & Enabled"
      service:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
