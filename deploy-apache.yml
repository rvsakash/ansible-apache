---
- name: Deploy HTTP-Only Production Apache Web Server
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    # Production Performance Settings
    apache_keepalive: "On"
    apache_max_keepalive_requests: 150
    apache_keepalive_timeout: 3
    apache_server_tokens: "Prod"
    apache_server_signature: "Off"
    apache_trace_enable: "Off"

  tasks:
    - name: "1. Update apt cache safely"
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: "2. Install Apache2 and UFW Firewall"
      apt:
        name:
          - apache2
          - ufw
        state: present

    - name: "3. Enable Core Production Apache Modules (No SSL)"
      community.general.apache2_module:
        name: "{{ item }}"
        state: present
      loop:
        - rewrite
        - headers
        - expires
      notify: Restart Apache

    - name: "4. Create Security Hardening & Performance Config"
      copy:
        dest: /etc/apache2/conf-available/security-hardening.conf
        content: |
          # Production Hardening & Performance by Ansible
          ServerTokens {{ apache_server_tokens }}
          ServerSignature {{ apache_server_signature }}
          TraceEnable {{ apache_trace_enable }}
          KeepAlive {{ apache_keepalive }}
          MaxKeepAliveRequests {{ apache_max_keepalive_requests }}
          KeepAliveTimeout {{ apache_keepalive_timeout }}
          
          # Essential Security Headers for Non-SSL
          Header set X-XSS-Protection "1; mode=block"
          Header set X-Frame-Options "SAMEORIGIN"
          Header set X-Content-Type-Options "nosniff"
          Header set Referrer-Policy "strict-origin-when-cross-origin"
      notify: Restart Apache

    - name: "4b. Enable Security Hardening Config"
      command: a2enconf security-hardening
      args:
        creates: /etc/apache2/conf-enabled/security-hardening.conf
      notify: Restart Apache

    # --- FIREWALL CONFIGURATION OPTIMIZED FOR SAFETY & JENKINS ---
    - name: "5. Set UFW default incoming policy to allow (Safe Mode)"
      community.general.ufw:
        policy: allow
        direction: incoming

    - name: "5b. Configure Specific Firewall Rules Safely"
      community.general.ufw:
        rule: allow
        name: "{{ item }}"
      loop:
        - 'OpenSSH'
        - 'Apache'

    - name: "5c. Explicitly Allow Jenkins Port"
      community.general.ufw:
        rule: allow
        port: '8080'
        proto: tcp

    - name: "5d. Enable UFW Firewall Service"
      community.general.ufw:
        state: enabled
    # -------------------------------------------------------------

    - name: "6. Deploy Custom Production Web Page"
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>My Ansible Project</title>
              <style>
                  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; }
                  .container { background: white; padding: 50px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); text-align: center; }
                  h1 { color: #2c3e50; font-size: 32px; margin-bottom: 20px; text-transform: capitalize; }
                  p { color: #7f8c8d; font-size: 16px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>welcome my ansible project</h1>
                  <p>Server IP: {{ ansible_default_ipv4.address }} | Hostname: {{ ansible_hostname }}</p>
              </div>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: '0644'

    - name: "7. Ensure Apache Service is Started & Enabled"
      service:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
